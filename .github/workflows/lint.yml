# ════════════════════════════════════════════════════════════════════
# NexusDL — lint.yml
#
# Runs every static check the project defines:
#
#   * pre-commit hooks  — YAML/JSON/TOML/XML syntax, trailing whitespace,
#                         missing EOF newlines, case conflicts, large files,
#                         private keys, submodules, shebangs, mixed line
#                         endings, debug statements, plus the custom
#                         NexusDL hooks (architecture, sites schema,
#                         token leak, pyproject consistency, print guard,
#                         YAML indent, empty __init__ guard) and the
#                         Conventional Commits message check.
#   * ruff              — Python lint + format check (via pre-commit).
#   * mypy              — strict type checking on the entire src/ tree.
#   * frontend          — tsc --noEmit + next lint.
#
# The mypy job runs in its own matrix cell for two reasons:
#
#   1. The pre-commit mypy hook is **skipped** (`SKIP=mypy`) because it
#      uses an isolated environment with only a hand-curated subset of
#      dependencies (`additional_dependencies` in .pre-commit-config.yaml),
#      which cannot resolve the project's full import graph — httpx,
#      typer, fastapi, loguru, and so on are all missing from that
#      environment.  This is a known limitation of isolated mypy in
#      pre-commit, and it is why the dedicated job below runs `uv run
#      mypy src` against the real installed project.
#
#   2. The mypy job also runs stricter than the pre-commit hook: it
#      type-checks `interfaces/` and `__main__.py`, which the pre-commit
#      hook's `files:` filter deliberately excludes for the same reason
#      as above.
#
# ════════════════════════════════════════════════════════════════════
#
# ⚠️  PREREQUISITE — pnpm-lock.yaml
#     The `frontend` job runs `pnpm install --frozen-lockfile`.  The
#     committed lockfile is currently a placeholder and must be
#     regenerated by running `pnpm install` locally once, then committed.
#     Until then, the `frontend` job will fail with a lockfile mismatch.
#     See the header of `build.yml` for the same prerequisite.
#
# ════════════════════════════════════════════════════════════════════

name: Lint

on:
  push:
    branches: [main]
    paths:
      - "src/nexusdl/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".pre-commit-config.yaml"
      - "MANIFEST.in"
      - "justfile"
      - "Makefile"
      - "src/nexusdl/interfaces/web/frontend/**"
      - ".github/workflows/lint.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/nexusdl/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".pre-commit-config.yaml"
      - "MANIFEST.in"
      - "justfile"
      - "Makefile"
      - "src/nexusdl/interfaces/web/frontend/**"
      - ".github/workflows/lint.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  # ──────────────────────────────────────────────────────────────────
  # 1. pre-commit — every hook except the isolated mypy one
  # ──────────────────────────────────────────────────────────────────
  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed by conventional-pre-commit and by
                           # any hook that inspects git history

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      # ``uv sync --all-extras`` installs the project itself plus every
      # optional dependency.  This is needed because several of the local
      # pre-commit hooks (``check-imports``, ``validate-sites``) invoke
      # scripts that may import ``nexusdl`` at module load; without the
      # install they would fail with ``ModuleNotFoundError`` even though
      # the hook code itself is correct.
      - name: Install project + all extras
        run: uv sync --all-extras

      # Pre-commit caches every hook environment under ``~/.cache/pre-commit``.
      # The cache key is a hash of the config file, so any change to a
      # ``rev:`` or an ``additional_dependencies`` field invalidates the
      # cache exactly when it should.
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install pre-commit
        run: uv tool install pre-commit

      # ``SKIP=mypy`` — see the workflow header.  The mypy hook runs in
      # the dedicated job below with the full project environment.
      #
      # ``--show-diff-on-failure`` shows what the auto-fixing hooks
      # changed.  The files are modified in the working tree but not
      # committed; the job fails regardless, so this is purely diagnostic.
      - name: Run pre-commit hooks
        env:
          SKIP: mypy
        run: |
          pre-commit run \
            --all-files \
            --show-diff-on-failure \
            --color always

  # ──────────────────────────────────────────────────────────────────
  # 2. mypy — strict, full project, real environment
  # ──────────────────────────────────────────────────────────────────
  mypy:
    name: mypy (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      # The full extras are needed: mypy type-checks ``interfaces/cli``
      # (imports Typer, Rich, Textual), ``interfaces/gui`` (imports
      # CustomTkinter), ``interfaces/web/backend`` (imports FastAPI,
      # Uvicorn, python-jose, passlib), ``core/session/playwright_pool``
      # (imports playwright), and every parser's mixin chain.  Missing a
      # single optional dependency would produce a cascading set of
      # "Cannot find implementation" errors that obscure real type bugs.
      - name: Install project + all extras
        run: uv sync --all-extras

      # ``uv run mypy src`` — the same invocation as ``make lint`` /
      # ``just lint``.  The ``[tool.mypy]`` configuration in
      # ``pyproject.toml`` supplies ``strict = true``, the pydantic
      # plugin, the per-module overrides for untyped third-party
      # libraries, and the frontend exclusion.
      - name: Run mypy
        run: uv run mypy src

  # ──────────────────────────────────────────────────────────────────
  # 3. frontend — TypeScript + Next.js ESLint
  # ──────────────────────────────────────────────────────────────────
  frontend:
    name: frontend (tsc + next lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/nexusdl/interfaces/web/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: src/nexusdl/interfaces/web/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  # ──────────────────────────────────────────────────────────────────
  # 4. Summary — one consolidated roll-up for the PR check tab
  # ──────────────────────────────────────────────────────────────────
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [pre-commit, mypy, frontend]
    if: always()
    steps:
      - name: Write summary
        run: |
          {
            echo "## Lint summary"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| pre-commit hooks | ${{ needs.pre-commit.result }} |"
            echo "| mypy (strict)    | ${{ needs.mypy.result }} |"
            echo "| frontend         | ${{ needs.frontend.result }} |"
            echo ""
            if [ "${{ needs.pre-commit.result }}" = "failure" ]; then
              echo "> **pre-commit failed** — see the job log for the exact"
              echo "> hook that rejected the change.  Most failures are"
              echo "> auto-fixable: run \`pre-commit run --all-files\`"
              echo "> locally, review the diff, and commit the fixes."
            fi
            if [ "${{ needs.mypy.result }}" = "failure" ]; then
              echo "> **mypy failed** — see the job log for the file:line"
              echo "> of each type error.  Run \`uv run mypy src\` locally"
              echo "> to iterate without pushing."
            fi
            if [ "${{ needs.frontend.result }}" = "failure" ]; then
              echo "> **frontend failed** — see the job log.  Common causes:"
              echo "> TypeScript error (\`pnpm typecheck\`) or ESLint error"
              echo "> (\`pnpm lint\`).  Run both locally in"
              echo "> \`src/nexusdl/interfaces/web/frontend\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
