# ════════════════════════════════════════════════════════════════════
# NexusDL — pre-commit hooks
# ════════════════════════════════════════════════════════════════════

# ``python3`` plutôt que ``python3.12`` : pre-commit utilise cette version
# pour *installer et exécuter* ses environnements de hooks.  Le binaire
# ``python3.12`` n'existe pas sur toutes les distributions (Debian
# bookworm fournit 3.11 par défaut), ce qui casserait pre-commit même sur
# une machine où le projet tourne correctement.  La version effective du
# *code* est contrôlée par ``requires-python = ">=3.12"`` dans
# pyproject.toml et par ``[tool.mypy] python_version`` /
# ``[tool.ruff] target-version``, indépendamment de la version qui
# exécute pre-commit.
default_language_version:
  python: python3

default_stages: [pre-commit]

# Exclusions globales — appliquées à TOUS les hooks par défaut.
exclude: |
  (?x)^(
    src/nexusdl/interfaces/web/frontend/.*|
    \.venv/.*|
    venv/.*|
    node_modules/.*|
    \.git/.*|
    build/.*|
    dist/.*|
    htmlcov/.*|
    \.ruff_cache/.*|
    \.mypy_cache/.*|
    \.pytest_cache/.*|
    \.hypothesis/.*
  )$


repos:
  # ──────────────────────────────────────────────────────────────────
  # 1. Hooks standards (pre-commit-hooks)
  # ──────────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Fichiers volumineux (protection contre les commits accidentels)
      - id: check-added-large-files
        args: ["--maxkb=1024"]

      # Syntaxe
      - id: check-ast
        name: check-ast (syntaxe Python)
      - id: check-json
      - id: check-toml
      - id: check-yaml
        # ``--unsafe`` autorise les tags YAML non-standard (``!!python/...``).
        # Conservé par précaution historique ; peut être retiré si aucun
        # fichier YAML du projet n'utilise de tags personnalisés — un
        # ``grep -rn '!!' --include='*.yaml' .`` permet de vérifier.
        # ``sites.yaml`` et ``nexus.plugin.yaml`` sont exclus ci-dessous
        # parce qu'ils contiennent des structures (ancres, merge keys)
        # que ``check-yaml`` refuse même avec ``--unsafe``.
        args: ["--allow-multiple-documents", "--unsafe"]
        exclude: |
          (?x)^(
            src/nexusdl/data/sites\.yaml|
            src/nexusdl/plugins/_example/nexus\.plugin\.yaml
          )$
      - id: check-xml

      # Conflits et problèmes de merge
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks

      # Sécurité basique
      - id: detect-private-key
      # ``forbid-submodules`` rejette toute submodule (existante ou
      # nouvelle).  C'est la politique du projet : aucune submodule,
      # jamais.  Le hook ``forbid-new-submodules`` serait redondant.
      - id: forbid-submodules

      # Exécutables
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

      # Typage — impose ``from __future__ import annotations`` dans tout
      # fichier Python qui contient des annotations de type, en cohérence
      # avec la règle du projet (toujours l'importer).
      - id: python-use-type-annotations

      # Normalisation
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: |
          (?x)^(
            .*\.ps1|
            .*\.psm1|
            .*\.psd1|
            .*\.bat|
            .*\.cmd
          )$
      - id: fix-byte-order-marker

      # Debug
      - id: debug-statements
        name: debug-statements (pas de breakpoint/pdb)

  # ──────────────────────────────────────────────────────────────────
  # 2. Ruff — lint + format (remplace flake8, isort, black)
  # ──────────────────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        name: ruff (lint)
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format
        name: ruff (format)

  # ──────────────────────────────────────────────────────────────────
  # 3. Mypy — typage strict
  # ──────────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        name: mypy (strict)
        additional_dependencies:
          - "pydantic>=2.7"
          - "pydantic-settings>=2.3"
          - "types-PyYAML"
          - "types-aiofiles"
        args:
          - "--strict"
          - "--config-file=pyproject.toml"
          - "--no-incremental"
        files: |
          (?x)^(
            src/nexusdl/(core|parsers|plugins|data)/.*\.py|
            src/nexusdl/version\.py
          )$
        exclude: |
          (?x)^(
            src/nexusdl/interfaces/.*|
            src/nexusdl/__main__\.py
          )$

  # ──────────────────────────────────────────────────────────────────
  # 4. Hooks customisés NexusDL (scripts locaux)
  # ──────────────────────────────────────────────────────────────────
  - repo: local
    hooks:
      # ── Architecture hexagonale ──
      - id: check-imports
        name: check-imports (architecture hexagonale)
        entry: python3 scripts/check_imports.py
        language: system
        pass_filenames: false
        always_run: true
        files: ^src/nexusdl/(core|parsers|plugins|data)/.*\.py$
        stages: [pre-commit]

      # ── Schéma sites.yaml ──
      - id: validate-sites
        name: validate-sites (sites.yaml contre schéma JSON)
        entry: python3 scripts/validate_sites.py
        language: system
        pass_filenames: false
        files: ^src/nexusdl/data/(sites\.yaml|sites_schema\.json)$
        stages: [pre-commit]

      # ── Aucun token GitHub / AWS / Slack en dur ──
      #
      # Scanne les fichiers texte du dépôt avec des patterns de tokens
      # réels — GitHub PATs, AWS access key IDs, Slack tokens, clés
      # privées SSH/PGP.  Couvre les cas que ``detect-private-key``
      # (hook standard) ne détecte pas.
      #
      # ``detect-private-key`` reste activé en complément : il attrape
      # des formats de clés plus exotiques (EC, DSA, PGP blocks) et son
      # implémentation est maintenue par la communauté.
      - id: no-token-leak
        name: no-token-leak (aucun token GitHub/AWS/Slack en dur)
        entry: bash -c '
          if grep -rnE \
            "gh[pousr]_[A-Za-z0-9]{36,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----" \
            --include="*.py" --include="*.yaml" --include="*.yml" \
            --include="*.toml" --include="*.md" --include="*.txt" \
            --include="*.json" --include="*.sh" --include="*.js" \
            --include="*.ts" --include="*.tsx" \
            --exclude-dir=.git --exclude-dir=node_modules \
            --exclude-dir=.venv --exclude-dir=venv \
            --exclude-dir=frontend --exclude-dir=htmlcov \
            --exclude-dir=dist --exclude-dir=build \
            .; then
            echo "❌ Token ou clé privée détecté en dur.";
            echo "   Retirer la valeur, utiliser .env + SecretStr.";
            exit 1;
          fi
          '
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # ── pyproject.toml cohérent avec version.py ──
      #
      # Vérifie que :
      #   - pyproject.toml existe et parse
      #   - [project] et [project.name] sont présents
      #   - requires-python commence par ">="
      #   - [tool.hatch.version].path pointe vers src/nexusdl/version.py
      #   - src/nexusdl/version.py existe
      #
      # One-liner plutôt qu'un bloc multi-ligne : YAML fold les
      # newlines en espaces quand l'indentation de continuation est
      # inférieure à celle du parent, donc un bloc multi-ligne est
      # fragile (fonctionne tant que chaque ligne se termine par ``;``).
      - id: check-pyproject
        name: check-pyproject (pyproject.toml + version.py cohérents)
        entry: python3 -c "import pathlib, tomllib; p = pathlib.Path('pyproject.toml'); assert p.exists(), 'pyproject.toml introuvable'; d = tomllib.loads(p.read_text(encoding='utf-8')); assert 'project' in d, 'section [project] manquante'; assert 'name' in d['project'], 'project.name manquant'; assert d['project']['requires-python'].startswith('>='), 'requires-python doit commencer par >='; v = d.get('tool', {}).get('hatch', {}).get('version', {}); assert v.get('path') == 'src/nexusdl/version.py', f'version path attendu src/nexusdl/version.py, trouvé {v.get(\"path\")!r}'; assert pathlib.Path('src/nexusdl/version.py').exists(), 'src/nexusdl/version.py introuvable'; print('✅ pyproject.toml + version.py cohérents')"
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|src/nexusdl/version\.py)$
        stages: [pre-commit]

      # ── Pas de print() dans src/ (hors entry points) ──
      #
      # Les entry points (``__main__.py``, ``cli_entry.py``, ``screens/``,
      # ``widgets/``, ``gui/``) ont le droit d'utiliser print() — c'est
      # leur seule sortie utilisateur.  Partout ailleurs, loguru est
      # obligatoire.
      - id: no-print-in-src
        name: no-print-in-src (utiliser loguru, pas print())
        entry: bash -c '
          if grep -rn --include="*.py" -E "^\s*print\(" src/nexusdl/ \
            | grep -v -E "(interfaces/cli/cli_entry\.py|interfaces/cli/screens/|interfaces/cli/widgets/|interfaces/gui/|/__main__\.py)"; then
            echo "❌ print() détecté dans src/ — utiliser loguru.";
            exit 1;
          fi
          '
        language: system
        pass_filenames: false
        files: ^src/nexusdl/.*\.py$
        stages: [pre-commit]

      # ── Fichiers YAML bien indentés (2 espaces, pas de tab) ──
      #
      # ``grep -rnP "^\t"`` remplace l'ancienne boucle ``for f in $files``
      # qui cassait sur les noms de fichiers contenant des espaces.
      # ``--exclude-dir=frontend`` exclut le frontend Next.js (déjà
      # exclu par le filtre global mais double sécurité).
      - id: yaml-indent
        name: yaml-indent (indentation 2 espaces, pas de tab)
        entry: bash -c '
          if grep -rnP "^\t" \
            --include="*.yml" --include="*.yaml" \
            --exclude-dir=.git --exclude-dir=node_modules \
            --exclude-dir=.venv --exclude-dir=venv \
            --exclude-dir=frontend --exclude-dir=htmlcov \
            --exclude-dir=dist --exclude-dir=build \
            .; then
            echo "❌ Tabulation détectée dans un fichier YAML.";
            exit 1;
          fi
          '
        language: system
        pass_filenames: false
        files: \.(yml|yaml)$
        stages: [pre-commit]

      # ── __init__.py non vides dans les couches clés ──
      #
      # ``core/``, ``parsers/`` et ``plugins/`` doivent exposer une API
      # via leurs ``__init__.py`` (imports, re-exports, hooks).  Un
      # ``__init__.py`` vide dans ces couches signale une régression
      # (fichier tronqué, copie partielle, merge raté).
      #
      # ``find`` est appelé pour chaque chemin séparément pour que
      # l'absence d'un des trois dossiers n'empêche pas le check des
      # autres — sur une installation partielle, on veut quand même
      # scanner ce qui existe.
      - id: init-not-empty-core
        name: init-not-empty (core/, parsers/, plugins/)
        entry: bash -c '
          files="";
          for d in src/nexusdl/core src/nexusdl/parsers src/nexusdl/plugins; do
            if [ -d "$d" ]; then
              found=$(find "$d" -name "__init__.py" -empty 2>/dev/null || true);
              if [ -n "$found" ]; then
                files="$files$found\n";
              fi;
            fi;
          done;
          if [ -n "$files" ]; then
            echo "❌ __init__.py vides dans core/parsers/plugins :";
            printf "%b" "$files";
            echo "   (laisser vide uniquement si intentionnel)";
            exit 1;
          fi
          '
        language: system
        pass_filenames: false
        files: ^src/nexusdl/(core|parsers|plugins)/.*__init__\.py$
        stages: [pre-commit]


  # ──────────────────────────────────────────────────────────────────
  # 5. Commit message — Conventional Commits (commit-msg stage)
  # ──────────────────────────────────────────────────────────────────
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        name: conventional-pre-commit (commit message)
        stages: [commit-msg]
        args:
          - "feat"
          - "fix"
          - "docs"
          - "style"
          - "refactor"
          - "perf"
          - "test"
          - "build"
          - "ci"
          - "chore"
          - "revert"
