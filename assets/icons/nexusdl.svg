<?xml version="1.0" encoding="UTF-8"?>
<!--
  NexusDL — Favicon / App Icon
  File: assets/icons/nexusdl.svg

  A simplified, small-size-optimized version of the NexusDL logo.
  Designed to be legible from 16×16 (browser tab) to 512×512 (PWA).

  Differences from assets/logo.svg:
    - No dashed ring (invisible at 16×16)
    - No corner accents (invisible at 16×16)
    - No glow filter (invisible below 64×64, adds file size)
    - No animation (favicons must not move)
    - Thicker "N" strokes (legible at 16×16)
    - 4px padding (safe zone for Android maskable)
    - Single gradient (fewer IDs, smaller file)

  Renders cleanly at:
    - 16×16   browser tab
    - 32×32   browser tab (retina)
    - 48×48   Windows taskbar
    - 64×64   bookmark
    - 128×128 desktop icon
    - 180×180 Apple touch icon
    - 192×192 Android / PWA
    - 256×256 Windows large icon
    - 512×512 PWA splash

  Maskable safe zone: inner 80% is guaranteed visible on Android
  adaptive icons (which crop 20% on each side by default).

  Fallback: PNG versions are generated by scripts/generate_icons.py
  (nexusdl-16.png, nexusdl-32.png, nexusdl-180.png, ...).

  License: GPL-3.0-or-later
  Author: Voldigoad-Holdings
  Date: 2026-10-29
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 256 256"
  width="256"
  height="256"
  role="img"
  aria-labelledby="nx-icon-title nx-icon-desc"
  version="1.1"
  xml:space="default"
  preserveAspectRatio="xMidYMid meet"
>
  <title id="nx-icon-title">NexusDL</title>
  <desc id="nx-icon-desc">
    Hexagonal shield with stylized letter N, the NexusDL icon.
  </desc>

  <!-- ════════════════════════════════════════════════════════════
       DEFS
       ════════════════════════════════════════════════════════════ -->
  <defs>
    <!-- Single gradient (indigo → cyan) -->
    <linearGradient id="nx-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="60%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- ════════════════════════════════════════════════════════════
       BACKGROUND — hexagonal shield (with 4px padding)
       ════════════════════════════════════════════════════════════ -->
  <!-- Outer hexagon (20px inset from edges = 8% padding) -->
  <path
    d="M 128 20 L 212 66 L 212 190 L 128 236 L 44 190 L 44 66 Z"
    fill="url(#nx-grad)"
  />

  <!-- Inner cutout (dark, provides contrast on any tab color) -->
  <path
    d="M 128 40 L 194 76 L 194 180 L 128 216 L 62 180 L 62 76 Z"
    fill="#0f172a"
  />

  <!-- ════════════════════════════════════════════════════════════
       LETTER N — thick strokes, centered, max contrast
       ════════════════════════════════════════════════════════════ -->
  <path
    d="M 94 180 L 94 76 L 118 76 L 138 148 L 138 76 L 162 76 L 162 180 L 138 180 L 118 108 L 118 180 Z"
    fill="#ffffff"
  />

  <!-- ════════════════════════════════════════════════════════════
       CENTER NODE — small accent (visible from 32×32)
       ════════════════════════════════════════════════════════════ -->
  <circle cx="128" cy="128" r="5" fill="#06b6d4" />
</svg>
