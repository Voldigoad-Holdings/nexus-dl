# ════════════════════════════════════════════════════════════════════
# NexusDL — Configuration example (config.yaml)
#
# Copie ce fichier en `config/config.yaml` pour surcharger les défauts.
# ⚠️  NE COMMITE JAMAIS `config/config.yaml` (déjà dans .gitignore).
#
# PRÉCÉDENCE (bas → haut) :
#   1. Defaults (core/config.py)
#   2. config/config.yaml      ← CE FICHIER
#   3. .env                    (secrets + déploiement)
#   4. Env vars NEXUSDL_*      (surcharge ponctuelle)
#   5. CLI args
#
# ⚠️  JAMAIS DE SECRETS ICI. Les secrets (SECRET_KEY, JWT_SECRET,
#     COOKIE_ENCRYPTION_KEY, credentials sites, cookies) vivent
#     UNIQUEMENT dans .env (voir ADR-004).
#
# Format : YAML 1.2, UTF-8, indentation 2 espaces.
# Validation : Pydantic v2 (core/config.py:Settings).
# ════════════════════════════════════════════════════════════════════


# ────────────────────────────────────────────────────────────────────
# APPLICATION
# ────────────────────────────────────────────────────────────────────
# Non-sensible. Surchargeable ici.
app:
  name: NexusDL
  environment: dev                    # dev | staging | prod
  # ⚠️ Les URLs publiques sont dépendantes du déploiement :
  #    elles vivent dans .env (NEXUSDL_PUBLIC_URL, etc.)


# ────────────────────────────────────────────────────────────────────
# HTTP
# ────────────────────────────────────────────────────────────────────
http:
  timeout_seconds: 30                 # 5–120
  max_retries: 3                      # 0–10
  user_agent: null                    # null = pool de User-Agents
  respect_robots_txt: true            # false = responsabilité utilisateur
  follow_redirects: true
  verify_ssl: true                    # false = ⚠️ DANGEREUX


# ────────────────────────────────────────────────────────────────────
# RATE LIMITS & CONCURRENCY
# ────────────────────────────────────────────────────────────────────
rate_limits:
  default_rate_limit_per_second: 2.0  # 0.1–10.0
  max_concurrent_downloads: 3         # 1–10
  max_concurrent_pages_per_chapter: 8 # 1–32
  per_site_overrides: {}              # ex: { mangadex: 5.0, sushiscan: 1.0 }


# ────────────────────────────────────────────────────────────────────
# STORAGE
# ────────────────────────────────────────────────────────────────────
# Chemin absolus ou ~ (expanduser). null = platformdirs (défaut).
storage:
  download_dir: null                  # ex: ~/Downloads/NexusDL
  temp_dir: null                      # ex: /tmp/nexusdl
  library_db_path: null               # ex: ~/.local/share/nexusdl/library.db
  cookie_storage_path: null           # ex: ~/.local/share/nexusdl/cookies.enc
  logs_dir: null                      # ex: ~/.local/state/nexusdl/logs
  max_disk_usage_gb: null             # null = illimité (⚠️ risque)


# ────────────────────────────────────────────────────────────────────
# LOGGING
# ────────────────────────────────────────────────────────────────────
logging:
  level: INFO                         # TRACE | DEBUG | INFO | WARNING | ERROR | CRITICAL
  format: pretty                      # json | text | pretty
  rotation: 10 MB                     # "10 MB", "1 day", "00:00"
  retention: 30 days                  # "30 days", "1 week"
  compress: true                      # gzip après rotation
  log_http_requests: false            # DEBUG only
  log_sql_queries: false              # DEBUG only


# ────────────────────────────────────────────────────────────────────
# CONTENT
# ────────────────────────────────────────────────────────────────────
# ⚠️ ALLOW_ADULT est une DÉCISION DE DÉPLOIEMENT → .env
#    (NEXUSDL_ALLOW_ADULT). Ce fichier ne peut que RAFFERMIR le refus.
content:
  allow_violent: true                 # true par défaut
  content_filter_strict: false        # true = whitelist genres
  allowed_genres: []                  # si content_filter_strict=true
  blocked_genres: []                  # ex: [horror, gore]
  # allowed_languages: [en, fr]       # filtre les langues autorisées
  # preferred_language: en            # langue préférée pour le multi-langue


# ────────────────────────────────────────────────────────────────────
# DOWNLOADER
# ────────────────────────────────────────────────────────────────────
downloader:
  default_format: CBZ                 # FOLDER | ZIP | CBZ | CB7 | PDF | CBT
  skip_existing: true                 # reprise sans re-télécharger
  overwrite: false                    # ⚠️ écrase les fichiers existants
  verify_checksums: true              # SHA-256 dedup
  priority: NORMAL                    # LOW | NORMAL | HIGH
  retry_failed_pages: true
  retry_max_attempts: 3
  retry_backoff_seconds: 2.0          # exponentiel
  retry_jitter_ratio: 0.2             # ±20%
  resume_partial: true                # reprend les .part


# ────────────────────────────────────────────────────────────────────
# PACKAGING
# ────────────────────────────────────────────────────────────────────
packaging:
  zip_compression_level: 6            # 0–9 (0=stocké, 9=max)
  cb7_compression_level: 7            # 1–9
  pdf_compression: lossless           # lossless | jpeg | webp
  pdf_image_quality: 85               # 1–100 (si lossy)
  include_comic_info_xml: true        # recommandé
  rename_pages: true                  # 001.jpg, 002.jpg, ...
  page_zero_padding: 3                # 001 → 01000 (pour > 999 pages)
  delete_temp_after_packaging: true
  thumbnail: true                     # extrait cover pour la bibliothèque


# ────────────────────────────────────────────────────────────────────
# IMAGE
# ────────────────────────────────────────────────────────────────────
image:
  convert_to: null                    # null | jpeg | webp | avif
  quality: 85                         # 1–100
  optimize: true                      # Pillow optimize flag
  strip_metadata: true                # EXIF/GPS (privacy)
  max_dimension: null                 # ex: 2000 → resize max 2000px
  watermark: false                    # ⚠️ non recommandé (voir ADR)
  watermark_text: null


# ────────────────────────────────────────────────────────────────────
# SESSION / CACHE
# ────────────────────────────────────────────────────────────────────
session:
  cache_enabled: true                 # hishel HTTP cache
  cache_ttl_seconds: 3600             # 1h
  cache_max_size_mb: 500              # 0 = illimité
  circuit_breaker_enabled: true
  circuit_breaker_threshold: 5        # échecs consécutifs
  circuit_breaker_timeout_seconds: 60 # avant half-open
  cookie_auto_refresh: true
  cookie_refresh_interval_minutes: 30
  keep_alive_connections: 20
  http2: true


# ────────────────────────────────────────────────────────────────────
# PLAYWRIGHT
# ────────────────────────────────────────────────────────────────────
# ⚠️ PLAYWRIGHT_ENABLED est une DÉCISION DE DÉPLOIEMENT → .env
#    (NEXUSDL_PLAYWRIGHT_ENABLED). Ce fichier configure le comportement
#    quand Playwright est activé.
playwright:
  headless: true
  max_contexts: 4                     # 1–8
  context_timeout_seconds: 30
  navigation_timeout_seconds: 45
  block_images: false                 # accélère le parsing si true
  block_media: true                   # vidéo/audio
  block_fonts: true
  viewport_width: 1280
  viewport_height: 1920
  user_agent: null                    # null = pool
  locale: en-US
  timezone: UTC


# ────────────────────────────────────────────────────────────────────
# FLARESOLVERR
# ────────────────────────────────────────────────────────────────────
# ⚠️ FLARESOLVERR_URL est un ENDPOINT DE DÉPLOIEMENT → .env
flaresolverr:
  timeout_seconds: 60
  max_concurrent_requests: 2
  retry_on_failure: true
  retry_max_attempts: 2


# ────────────────────────────────────────────────────────────────────
# PROXY
# ────────────────────────────────────────────────────────────────────
# ⚠️ Les URLs de proxy (avec credentials) vivent dans .env
#    (NEXUSDL_PROXY_URL / NEXUSDL_PROXY_FILE).
proxy:
  enabled: false
  rotation_strategy: round_robin      # round_robin | random | least_used
  health_check_interval_seconds: 300
  max_failures_before_removal: 3
  timeout_seconds: 10
  retry_on_failure: true


# ────────────────────────────────────────────────────────────────────
# LIBRARY
# ────────────────────────────────────────────────────────────────────
library:
  auto_scan_on_startup: true
  scan_interval_minutes: 60           # 0 = jamais
  auto_update_enabled: true
  auto_update_interval_hours: 24
  fts5_enabled: true                  # full-text search
  reading_progress_sync: true
  deduplicate_by_checksum: true
  generate_thumbnails: true
  thumbnail_size: 256                 # px


# ────────────────────────────────────────────────────────────────────
# COMPLIANCE
# ────────────────────────────────────────────────────────────────────
compliance:
  robots_txt_enabled: true            # ⚠️ false = responsabilité utilisateur
  robots_txt_cache_ttl_hours: 24
  robots_txt_timeout_seconds: 10
  user_agent_string: "NexusDL/0.1.0 (+https://github.com/Voldigoad-Holdings/nexus-dl)"


# ────────────────────────────────────────────────────────────────────
# API / WEB
# ────────────────────────────────────────────────────────────────────
api:
  host: 0.0.0.0                       # ⚠️ 127.0.0.1 pour local-only
  port: 8000
  workers: 1                          # > 1 = nécessite PostgreSQL
  enable_docs: true                   # false en prod
  allow_anonymous: false              # GUEST role
  allow_registration: true            # false après le 1er admin
  cors_origins: []                    # ⚠️ dépend du déploiement → .env
  rate_limit_per_minute: 60
  request_id_header: X-Request-ID
  max_request_size_mb: 100


# ────────────────────────────────────────────────────────────────────
# WEBSOCKET
# ────────────────────────────────────────────────────────────────────
websocket:
  enabled: true
  ping_interval_seconds: 30
  ping_timeout_seconds: 10
  max_connections: 100
  max_message_size_kb: 1024
  progress_throttle_hz: 10            # throttle UI updates


# ────────────────────────────────────────────────────────────────────
# TUI
# ────────────────────────────────────────────────────────────────────
tui:
  theme: dark                         # dark | light
  refresh_rate_hz: 10
  show_progress_bars: true
  mouse_enabled: true
  vim_keys: true                      # hjkl pour naviguer


# ────────────────────────────────────────────────────────────────────
# GUI
# ────────────────────────────────────────────────────────────────────
gui:
  theme: system                       # dark | light | system
  window_width: 1280
  window_height: 800
  remember_window_position: true
  start_minimized: false
  tray_enabled: true
  notifications: true
  font_scale: 1.0                     # 0.8–1.5


# ────────────────────────────────────────────────────────────────────
# PLUGINS
# ────────────────────────────────────────────────────────────────────
# ⚠️ Les plugins activés (noms) vivent dans .env (NEXUSDL_PLUGINS).
plugins:
  enabled: true
  auto_discover: true
  install_dir: null                   # null = platformdirs
  allow_network: true
  allow_filesystem: true
  timeout_seconds: 30
  max_memory_mb: 256                  # limite par plugin


# ────────────────────────────────────────────────────────────────────
# PERFORMANCE
# ────────────────────────────────────────────────────────────────────
performance:
  gc_threshold: 700                   # Python GC
  uvloop: true                        # accélération asyncio (Linux/macOS)
  use_orjson: true
  batch_page_downloads: 8
  prefetch_pages: 3                   # télécharge 3 pages d'avance
  streaming_chunk_size_kb: 64


# ────────────────────────────────────────────────────────────────────
# DEVELOPMENT
# ────────────────────────────────────────────────────────────────────
# ⚠️ Ignoré en prod (app.environment=prod).
development:
  reload_on_change: true
  profile_enabled: false
  mock_network: false                 # utilise des fixtures
  debug_endpoints: false              # /api/v1/_debug/*
  seed_db_on_startup: false
