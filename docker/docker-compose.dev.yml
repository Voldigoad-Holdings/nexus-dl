# ════════════════════════════════════════════════════════════════════
# NexusDL — Docker Compose (DEVELOPMENT)
#
# Fichier : docker/docker-compose.dev.yml
#
# Lance la stack de développement avec HOT-RELOAD sur backend et
# frontend. Les volumes montent le code source pour édition live.
#
# Usage :
#   # Backend + frontend (défaut)
#   docker compose -f docker/docker-compose.dev.yml up
#
#   # Avec Redis
#   docker compose -f docker/docker-compose.dev.yml --profile redis up
#
#   # Avec FlareSolverr
#   docker compose -f docker/docker-compose.dev.yml --profile flaresolverr up
#
#   # Avec Mailhog (test emails)
#   docker compose -f docker/docker-compose.dev.yml --profile mail up
#
#   # Tout
#   docker compose -f docker/docker-compose.dev.yml \
#       --profile redis --profile flaresolverr --profile mail up
#
#   # Rebuild
#   docker compose -f docker/docker-compose.dev.yml up --build
#
#   # Cleanup
#   docker compose -f docker/docker-compose.dev.yml down -v
#
# Accès :
#   - Frontend  : http://localhost:3000
#   - Backend   : http://localhost:8000
#   - API docs  : http://localhost:8000/docs
#   - Redis     : localhost:6379 (profile redis)
#   - FlareSolverr : http://localhost:8191 (profile flaresolverr)
#   - Mailhog   : http://localhost:8025 (profile mail)
#   - Debugger  : localhost:5678 (debugpy)
#
# ⚠️  NE PAS UTILISER EN PRODUCTION. Ce fichier est pour le dev local.
# ⚠️  Les secrets dans .env.dev sont des valeurs de test.
# ════════════════════════════════════════════════════════════════════

name: nexusdl-dev

# ────────────────────────────────────────────────────────────────────
# ANCRES (réutilisables)
# ────────────────────────────────────────────────────────────────────
x-common-env: &common-env
  TZ: UTC
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-backend: &healthcheck-backend
  test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s

x-healthcheck-frontend: &healthcheck-frontend
  test: ["CMD", "curl", "-sf", "http://localhost:3000/"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 60s


# ────────────────────────────────────────────────────────────────────
# SERVICES
# ────────────────────────────────────────────────────────────────────
services:

  # ════════════════════════════════════════════════════════════════
  # BACKEND (FastAPI + Uvicorn --reload)
  # ════════════════════════════════════════════════════════════════
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: builder                # ← stage avec compilateurs, pas le runtime
      args:
        PYTHON_VERSION: "3.12"
    image: nexusdl-dev-backend:latest
    container_name: nexusdl-dev-backend

    # Commande : uvicorn avec reload
    command: >
      uvicorn nexusdl.interfaces.web.backend.main:app
        --host 0.0.0.0
        --port 8000
        --reload
        --reload-dir /app/src
        --log-level debug
        --proxy-headers
        --forwarded-allow-ips '*'

    working_dir: /app

    # Variables d'environnement (dev)
    environment:
      <<: *common-env
      NEXUSDL_APP_ENVIRONMENT: dev
      NEXUSDL_LOG_LEVEL: DEBUG
      NEXUSDL_LOG_FORMAT: pretty
      NEXUSDL_API_ENABLE_DOCS: "true"
      NEXUSDL_API_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      NEXUSDL_DATABASE_URL: sqlite+aiosqlite:////data/library.db
      NEXUSDL_DOWNLOAD_DIR: /downloads
      NEXUSDL_DATA_DIR: /data
      NEXUSDL_CONFIG_DIR: /config
      NEXUSDL_LOGS_DIR: /data/logs
      NEXUSDL_TEMP_DIR: /tmp/nexusdl
      # Redis (si profile redis activé)
      # NEXUSDL_REDIS_URL: redis://redis:6379/0
      # FlareSolverr (si profile flaresolverr activé)
      # NEXUSDL_FLARESOLVERR_URL: http://flaresolverr:8191/v1

    # Charge .env.dev (secrets de dev) SI présent
    env_file:
      - path: ../.env.dev
        required: false               # ← ne casse pas si absent

    # Ports
    ports:
      - "8000:8000"                   # API
      - "5678:5678"                   # debugpy

    # Volumes (code monté pour hot-reload)
    volumes:
      # Code (editable live)
      - ../src:/app/src:ro
      - ../config:/app/config:ro
      # Data (persistant mais réinitialisable)
      - nexusdl_dev_data:/data
      - nexusdl_dev_downloads:/downloads
      - nexusdl_dev_config:/config
      # Cache uv (rapide)
      - uv_cache:/root/.cache/uv
      # Temp
      - /tmp/nexusdl

    # Healthcheck
    healthcheck: *healthcheck-backend

    # Restart
    restart: unless-stopped

    # Logs
    logging: *default-logging

    # Init (reap zombies)
    init: true

    # Dépendances (db, redis optionnel)
    depends_on:
      # redis:
      #   condition: service_healthy
      #   required: false
      {}

    # Réseau
    networks:
      - nexusdl_dev

    # Resources
    deploy:
      resources:
        limits:
          memory: 1G

  # ════════════════════════════════════════════════════════════════
  # FRONTEND (Next.js dev server)
  # ════════════════════════════════════════════════════════════════
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      target: frontend-builder       # ← stage Node.js (pas le runtime final)
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
        NEXT_PUBLIC_APP_NAME: NexusDL (dev)
    image: nexusdl-dev-frontend:latest
    container_name: nexusdl-dev-frontend

    # Commande : Next.js dev server avec hot-reload
    command: pnpm dev --hostname 0.0.0.0 --port 3000

    working_dir: /app

    # Variables d'environnement (dev)
    environment:
      <<: *common-env
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      # Hot-reload sur macOS/WSL2 (file watcher)
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      # API URLs
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NEXT_PUBLIC_APP_NAME: NexusDL (dev)

    # Port
    ports:
      - "3000:3000"

    # Volumes (code monté + node_modules préservé)
    volumes:
      # Code (editable live)
      - ../src/nexusdl/interfaces/web/frontend:/app
      # node_modules (volume nommé pour préserver l'install)
      - frontend_node_modules:/app/node_modules
      # Cache Next.js (build plus rapide)
      - frontend_next_cache:/app/.next
      # Cache pnpm
      - pnpm_store:/root/.local/share/pnpm/store

    # Healthcheck
    healthcheck: *healthcheck-frontend

    # Restart
    restart: unless-stopped

    # Logs
    logging: *default-logging

    # Init
    init: true

    # Réseau
    networks:
      - nexusdl_dev

    # Resources
    deploy:
      resources:
        limits:
          memory: 1.5G

  # ════════════════════════════════════════════════════════════════
  # REDIS (optionnel — profile redis)
  # ════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: nexusdl-dev-redis
    profiles: [redis]
    command: >
      redis-server
        --appendonly yes
        --maxmemory 128mb
        --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - nexusdl_dev

  # ════════════════════════════════════════════════════════════════
  # FLARESOLVERR (optionnel — profile flaresolverr)
  # ════════════════════════════════════════════════════════════════
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: nexusdl-dev-flaresolverr
    profiles: [flaresolverr]
    environment:
      LOG_LEVEL: info
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
      TZ: UTC
    ports:
      - "8191:8191"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8191/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - nexusdl_dev

  # ════════════════════════════════════════════════════════════════
  # MAILHOG (optionnel — profile mail)
  # ════════════════════════════════════════════════════════════════
  mailhog:
    image: mailhog/mailhog:latest
    container_name: nexusdl-dev-mailhog
    profiles: [mail]
    ports:
      - "1025:1025"                   # SMTP
      - "8025:8025"                   # Web UI
    environment:
      MH_HOSTNAME: mailhog.local
    restart: unless-stopped
    logging: *default-logging
    networks:
      - nexusdl_dev

  # ════════════════════════════════════════════════════════════════
  # ADMINER (optionnel — profile tools)
  # ════════════════════════════════════════════════════════════════
  adminer:
    image: adminer:latest
    container_name: nexusdl-dev-adminer
    profiles: [tools]
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: ""
      ADMINER_DESIGN: dracula
    restart: unless-stopped
    logging: *default-logging
    networks:
      - nexusdl_dev


# ────────────────────────────────────────────────────────────────────
# VOLUMES NOMMÉS
# ────────────────────────────────────────────────────────────────────
volumes:
  # Data NexusDL (persistant entre restarts)
  nexusdl_dev_data:
    name: nexusdl_dev_data
  nexusdl_dev_downloads:
    name: nexusdl_dev_downloads
  nexusdl_dev_config:
    name: nexusdl_dev_config

  # Frontend (préserve node_modules et cache entre rebuilds)
  frontend_node_modules:
    name: nexusdl_dev_frontend_node_modules
  frontend_next_cache:
    name: nexusdl_dev_frontend_next_cache
  pnpm_store:
    name: nexusdl_dev_pnpm_store

  # Caches
  uv_cache:
    name: nexusdl_dev_uv_cache

  # Services optionnels
  redis_data:
    name: nexusdl_dev_redis_data


# ────────────────────────────────────────────────────────────────────
# RÉSEAU
# ────────────────────────────────────────────────────────────────────
networks:
  nexusdl_dev:
    name: nexusdl_dev
    driver: bridge
