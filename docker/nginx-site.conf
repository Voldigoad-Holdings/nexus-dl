# NexusDL — Nginx SITE configuration
#
# Fichier : docker/nginx-site.conf
#
# Rôle : bloc `server {}` avec les routes (API, WS, frontend).
#        Copié vers `/etc/nginx/conf.d/default.conf` par Dockerfile.web.
#
# ⚠️  Ce fichier NE DOIT PAS contenir de `http {}`.
#     Il est inclus DANS le bloc `http {}` de `nginx.conf`.
#
# Routes :
#   /api/*     → FastAPI (127.0.0.1:8000)
#   /ws/*      → FastAPI WebSocket (127.0.0.1:8000)
#   /health    → Nginx (200 OK)
#   /*         → Next.js (127.0.0.1:3000)
#
# ⚠️  Nginx écoute sur 8080 (non-root, pas 80).

# ────────────────────────────────────────────────────────────────────
# Port 8080 (HTTP non-root)
# ────────────────────────────────────────────────────────────────────
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    # ──────────────────────────────────────────────────────────────
    # Sécurité — headers
    # ──────────────────────────────────────────────────────────────
    # HSTS (si HTTPS via Caddy en amont)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Anti-clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Anti-MIME-sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # XSS (legacy, mais utile)
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions (désactive les APIs sensibles)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # CSP (Content Security Policy)
    # Note : Next.js injecte des scripts inline → 'unsafe-inline' requis.
    # En production, utiliser un nonce (complexe à mettre en place).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Masque le serveur
    add_header X-Powered-By "" always;

    # ──────────────────────────────────────────────────────────────
    # Routes
    # ──────────────────────────────────────────────────────────────

    # ── Health (Nginx lui-même, pas de proxy) ──
    location = /health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # ── API (FastAPI) ──
    location /api/ {
        # Rate limiting (60 req/min par IP)
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 20;

        # Retry sur 502/503/504
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;

        proxy_pass http://nexusdl_backend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;

        # Keepalive
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffers
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Cache désactivé (API dynamique)
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ── WebSocket (FastAPI) ──
    location /ws/ {
        # Pas de rate limit (WS = connexion persistante)
        # Pas de limit_conn (déjà compté dans /api/)

        proxy_pass http://nexusdl_backend;
        proxy_http_version 1.1;

        # Headers WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Timeouts longs (WS persistant)
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # Buffer désactivé (WS = streaming)
        proxy_buffering off;

        # Cache désactivé
        add_header Cache-Control "no-store" always;
    }

    # ── Frontend Next.js ──
    location / {
        # Rate limiting modéré
        limit_req zone=api_limit burst=30 nodelay;
        limit_conn conn_limit 30;

        proxy_pass http://nexusdl_frontend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;

        # Keepalive
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Buffers
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # ── Cache statique Next.js (immutable) ──
    # Les assets Next.js ont un hash dans le nom → cache 1 an.
    location /_next/static/ {
        proxy_pass http://nexusdl_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # Cache 1 an
        expires 1y;
        add_header Cache-Control "public, immutable" always;

        # Pas de log (bruit)
        access_log off;
    }

    # ── Cache statique NexusDL (logo, favicon) ──
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|avif|woff|woff2|ttf|eot)$ {
        proxy_pass http://nexusdl_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # Cache 30 jours
        expires 30d;
        add_header Cache-Control "public" always;

        access_log off;
    }

    # ── Bloquer les chemins sensibles ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
