# NexusDL — Nginx MAIN configuration
#
# Fichier : docker/nginx.conf
#
# Rôle : configuration racine de Nginx (worker_processes, events, http).
#        Le bloc `server {}` vit dans `docker/nginx-site.conf`
#        (copié dans `/etc/nginx/conf.d/default.conf`).
#
# ⚠️  Ce fichier NE DOIT PAS contenir de `server {}`.
#     Si tu ajoutes un `server {}` ici, il sera dupliqué avec celui de
#     `conf.d/default.conf` → conflit.
#
# Build : copié vers /etc/nginx/nginx.conf par Dockerfile.web
#
# Logs   : /data/logs/nginx.{access,error}.log (volume NexusDL)
# PID    : /run/nginx/nginx.pid (non-root)
# User   : nexusdl (pas de `user` directive — Nginx tourne déjà en nexusdl)

# ────────────────────────────────────────────────────────────────────
# Worker processes
# ────────────────────────────────────────────────────────────────────
# `auto` = nombre de CPUs (recommandé).
worker_processes auto;

# Fichier PID (doit être writable par l'utilisateur nexusdl)
pid /run/nginx/nginx.pid;

# ────────────────────────────────────────────────────────────────────
# Logs globaux
# ────────────────────────────────────────────────────────────────────
# Log d'erreur principal (warn = erreurs + warnings, pas d'info)
error_log /data/logs/nginx.error.log warn;

# ────────────────────────────────────────────────────────────────────
# Events
# ────────────────────────────────────────────────────────────────────
events {
    # Max connexions simultanées par worker
    worker_connections 1024;

    # Accepte plusieurs requêtes en un seul paquet (perf)
    multi_accept on;

    # Utilise epoll (Linux) — plus rapide que select
    use epoll;
}

# ────────────────────────────────────────────────────────────────────
# HTTP
# ────────────────────────────────────────────────────────────────────
http {
    # ──────────────────────────────────────────────────────────────
    # MIME types + charset
    # ──────────────────────────────────────────────────────────────
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    # ──────────────────────────────────────────────────────────────
    # Format des logs
    # ──────────────────────────────────────────────────────────────
    # JSON structuré (compatible Loki, ELK, Datadog)
    log_format json_main escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"remote_user":"$remote_user",'
            '"request_method":"$request_method",'
            '"request_uri":"$request_uri",'
            '"server_protocol":"$server_protocol",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for",'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_status":"$upstream_status",'
            '"upstream_response_time":"$upstream_response_time",'
            '"request_id":"$request_id"'
        '}';

    access_log /data/logs/nginx.access.log json_main buffer=32k flush=5s;

    # ──────────────────────────────────────────────────────────────
    # Performance
    # ──────────────────────────────────────────────────────────────
    # Envoi de fichiers (kernel-space)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Timeouts
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;

    # Buffers
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    output_buffers 2 32k;
    postpone_output 1460;

    # Body size (uploads)
    client_max_body_size 100M;

    # ──────────────────────────────────────────────────────────────
    # Sécurité
    # ──────────────────────────────────────────────────────────────
    # Masque la version de Nginx
    server_tokens off;

    # Timeout sur les slowloris (client lent)
    reset_timedout_connection on;

    # ──────────────────────────────────────────────────────────────
    # Compression
    # ──────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_disable "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;

    # Brotli (si module chargé — fallback silencieux sinon)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript image/svg+xml;

    # ──────────────────────────────────────────────────────────────
    # Real IP (derrière Caddy / reverse proxy externe)
    # ──────────────────────────────────────────────────────────────
    # Caddy est dans le même réseau Docker. On accepte les X-Forwarded-*
    # depuis le réseau Docker uniquement (sécurité).
    # Caddy utilise `header_up X-Real-IP {remote_host}` → IP réelle du client.
    set_real_ip_from 172.16.0.0/12;   # Docker networks
    set_real_ip_from 10.0.0.0/8;      # Docker networks (custom)
    set_real_ip_from 192.168.0.0/16;  # LAN
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ──────────────────────────────────────────────────────────────
    # Upstreams
    # ──────────────────────────────────────────────────────────────
    # FastAPI (backend)
    upstream nexusdl_backend {
        server 127.0.0.1:8000;
        keepalive 32;
        keepalive_timeout 60s;
        keepalive_requests 1000;
    }

    # Next.js (frontend)
    upstream nexusdl_frontend {
        server 127.0.0.1:3000;
        keepalive 32;
        keepalive_timeout 60s;
        keepalive_requests 1000;
    }

    # ──────────────────────────────────────────────────────────────
    # Rate limiting (au niveau Nginx, en complément du backend)
    # ──────────────────────────────────────────────────────────────
    # Zone pour limiter les requêtes API par IP (60 req/min = 1/s)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    # Zone pour limiter les connexions simultanées par IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ──────────────────────────────────────────────────────────────
    # Include des sites
    # ──────────────────────────────────────────────────────────────
    # Charge tous les fichiers de /etc/nginx/conf.d/
    # (dont default.conf → copie de docker/nginx-site.conf)
    include /etc/nginx/conf.d/*.conf;
}
