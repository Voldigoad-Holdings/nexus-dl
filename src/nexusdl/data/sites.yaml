# ════════════════════════════════════════════════════════════════════
# NexusDL — Supported sites (single source of truth)
#
# File: src/nexusdl/data/sites.yaml
#
# This file lists all supported sites. Each entry:
#   - is validated against sites_schema.json (CI)
#   - is loaded by SiteRegistry at startup
#   - instantiates a parser via DefaultParserFactory (ADR-003)
#
# ⚠️  NEVER put secrets here (cookies values, passwords, tokens).
#     Values live in .env (see ADR-004).
#
# ⚠️  NEVER put production app URLs here (nexusdl.dev, etc.).
#     Those live in .env.
#
# ⚠️  CBR format is NOT supported (see ADR-002).
#
# ⚠️  Domains MUST be HTTPS only.
#
# Naming convention:
#   - id: snake_case, matches parser.site_id and module name
#   - parser_class: "nexusdl.parsers.<lang>.<site>:<Class>Parser"
#
# Categories: fr, en, kr, adult
#   - The "adult" category is filtered by NEXUSDL_ALLOW_ADULT.
#   - The category is metadata, not policy.
# ════════════════════════════════════════════════════════════════════

