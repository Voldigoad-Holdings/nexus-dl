# ════════════════════════════════════════════════════════════════════
# DISABLED SITES — parsers present but not active by default
# ────────────────────────────────────────────────────────────────
# Each entry is either:
#   * a bare site id (default: disable everywhere), or
#   * a mapping ``{id: <site_id>, reason: <why>}``.
#
# A disabled site's parser is still importable and registered with the
# factory, but ``SiteRegistry.list_sites`` omits it and ``search_all``
# skips it.  Re-enable by removing the entry and restarting NexusDL.
# ════════════════════════════════════════════════════════════════════
disabled_sites:
  # Bato.to was permanently shut down in January 2026 after a
  # coordinated international law enforcement operation.  All
  # associated domains (bato.to, bato.ing, bato.si, xbato.com,
  # mangapark.io) are dead.  No successor has taken over.
  - id: batoto
    reason: "Permanently shut down in Jan 2026 after law enforcement operation"

  # Reaper Scans shut down in May 2025 after a cease-and-desist from
  # Kakao Entertainment.  The domain may still resolve to a placeholder.
  - id: reaperscans
    reason: "Permanently shut down in May 2025 after Kakao C&D"

  # Asura Scans KR has no verifiable first-party Korean domain.  The
  # parser falls back to the English site (asuracomic.net) which
  # serves no Korean content.  Re-enable once the real domain is
  # identified.
  - id: asura_scans_kr
    reason: "No verifiable Korean first-party domain; parser falls back to EN site"
