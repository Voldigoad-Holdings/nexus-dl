# ════════════════════════════════════════════════════════════════════
# NexusDL — Supported sites (single source of truth)
#
# File: src/nexusdl/data/sites.yaml
#
# Validated against sites_schema.json (CI), loaded by SiteRegistry at
# startup, used by DefaultParserFactory (ADR-003).
#
# ⚠️  NO secrets (cookies values, passwords, tokens) — live in .env (ADR-004).
# ⚠️  NO production app URLs — live in .env.
# ⚠️  NO CBR — not supported (ADR-002).
# ⚠️  Domains MUST be HTTPS only (no paths, no query strings).
# ⚠️  ``language`` MUST be one of the values of ``core.models.enums.Language``:
#       fr, en, ja, ko, zh, es, pt, it, de, ru, ar, unknown
#     (NOT "kr" — Korean is "ko").
#
# ════════════════════════════════════════════════════════════════════
# DOMAIN RESOLUTION — preventive strategy
# ════════════════════════════════════════════════════════════════════
# Scanlation site domains change frequently (ARCOM blocking in France,
# Cloudflare migrations, hosting disputes, legal pressure).  To remain
# resilient:
#
#   1. Each site lists MULTIPLE domains: the current primary first, then
#      known mirrors / fallbacks.  The parser tries them in order and
#      caches the first one that responds.
#
#   2. Domains are NEVER hardcoded in parser modules — the parser reads
#      ``self._base_url`` from the site's resolved primary domain.
#
#   3. A site with no working domain is moved to ``disabled_sites``
#      (bottom of this file) with a ``reason``.  Its parser remains
#      registered, so re-enabling it is a one-line change.
#
#   4. When a domain permanently changes, only this file needs updating.
#      No parser module is modified.
# ════════════════════════════════════════════════════════════════════

config_version: 1

sites:

