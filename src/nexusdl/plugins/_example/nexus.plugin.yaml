# =============================================================================
# nexus.plugin.yaml — NexusDL plugin manifest (reference example)
# =============================================================================
# Schema : pydantic model ``nexusdl.plugins.validators.PluginManifest``
#          (``extra="forbid"``, ``frozen=True``, strings stripped). This file
#          is parsed and validated by ``load_manifest()`` *before* plugin.py
#          is imported; any schema violation aborts the load with
#          ``PluginError`` and the offending field is named in the message.
#          A JSON Schema can be generated on demand from the Pydantic model
#          via ``nexusdl.plugins.validators.export_json_schema()`` — there is
#          no hand-maintained schema file to drift.
# Docs   : docs/source/development/plugins.md
# -----------------------------------------------------------------------------
# This manifest MUST live side-by-side with the ``plugin.py`` it describes.
# It is NEVER a secret store: authentication tokens, API keys, and site
# credentials belong in ``.env`` (see docs/usage/configuration.md), never here.
# -----------------------------------------------------------------------------
# Naming note: this directory is ``_example/``. The loader skips every
# directory whose name starts with an underscore (see
# ``PluginLoader._iter_plugin_dirs``), so this reference plugin is never
# loaded automatically. To use it as a template:
#
#   1. Copy the whole ``_example/`` directory to your plugin directory.
#   2. Rename the copy so it no longer starts with ``_``.
#   3. Update ``name`` and ``version`` below AND the matching class
#      attributes in plugin.py — the loader cross-checks both.
#   4. Replace the hook bodies with your own logic.
# =============================================================================

# --- Identity ---------------------------------------------------------------
# ``name`` and ``version`` MUST match the corresponding class attributes on
# the plugin class in plugin.py. Cross-checked by
# ``validate_class_matches_manifest``; a mismatch aborts the load with
# PluginError. ``name`` must match ``^[a-z][a-z0-9_-]*$``.
name: example
version: "1.0.0"

# --- Authorship -------------------------------------------------------------
# ``email`` and ``homepage`` are optional and free-form: they are surfaced
# in ``nexusdl plugins info`` but not validated as URL/email, since a plugin
# may legitimately point at a self-hosted forge, a git mirror, or no URL at
# all.
author: Voldigoad-Holdings
email: voldigoad-holdings@users.noreply.github.com
homepage: https://github.com/Voldigoad-Holdings/nexus-dl

# --- Description ------------------------------------------------------------
# Rendered verbatim in ``nexusdl plugins list`` and in the web UI. One short
# paragraph is the norm. Folding (``>-``) collapses newlines into spaces.
description: >-
  Reference NexusDL plugin. Exercises every hook of the NexusPlugin protocol
  as a strictly-transparent passthrough and persists a small statistics file
  under the plugin data directory. Safe to enable in any environment; it
  never modifies the download pipeline.

# --- Licensing --------------------------------------------------------------
# SPDX identifier. GPL-3.0-or-later is required for plugins that link against
# nexusdl core at runtime (see docs/source/development/contributing.md).
license: GPL-3.0-or-later

# --- Compatibility ----------------------------------------------------------
# Both version strings are parsed with ``packaging.version.Version``.
#
#   * ``min_nexusdl_version`` is INCLUSIVE  (host >= 3.0.0)
#   * ``max_nexusdl_version`` is EXCLUSIVE  (host <  4.0.0)
#   * Omit ``max_nexusdl_version`` (or set it to ``null``) for "no upper
#     bound". A manifest whose ``max`` is not strictly greater than ``min``
#     is rejected at parse time.
min_nexusdl_version: "3.0.0"
max_nexusdl_version: "4.0.0"

# PEP 440 specifier against the interpreter running NexusDL. Parsed with
# ``packaging.specifiers.SpecifierSet``. The host project itself requires
# Python >= 3.12 (see pyproject.toml), so a plugin cannot meaningfully
# declare anything narrower. Omit the key for "no constraint".
python_requires: ">=3.12"

# --- Declared hooks ---------------------------------------------------------
# Every entry MUST be a known hook name — see ``nexusdl.plugins.hooks`` for
# the canonical list and each hook's sync/async flavour:
#
#   on_load              sync    mandatory (declared on NexusPlugin)
#   on_unload            sync    mandatory (declared on NexusPlugin)
#   on_before_download   async   optional
#   on_after_download    async   optional
#   on_page_downloaded   async   optional
#   on_error             async   optional
#
# Unknown names and duplicate entries are rejected at parse time
# (``PluginManifest._validate_hooks_no_duplicates`` + the ``HookName``
# Literal). For each name listed here, ``validate_class_matches_manifest``
# checks that the plugin class actually implements it with the correct
# flavour — a declared-but-missing hook is a load error, not a silent no-op.
#
# Two directions are independent:
#
#   * Declaring a hook does NOT make it mandatory. A plugin may list only
#     the subset it actually implements; the loader dispatches only to what
#     is declared here.
#   * Implementing a hook without declaring it here is NOT an error — the
#     loader simply never calls it. This lets a plugin reuse a shared base
#     class that carries no-op defaults without paying for dispatch it does
#     not need.
#
# ExamplePlugin (plugin.py) implements all six, so all six are declared.
hooks:
  - on_load
  - on_unload
  - on_before_download
  - on_after_download
  - on_page_downloaded
  - on_error

# --- Dependencies -----------------------------------------------------------
# PEP 508 requirement strings (``packaging.requirements.Requirement``).
# The loader checks these are satisfied in the current interpreter before
# activating the plugin; it never installs anything. This example uses only
# the standard library and nexusdl itself, so the list is empty.
#
# The key is optional (Pydantic default: empty tuple), but keeping it
# explicit — even when empty — documents the author's intent. An empty
# value (``dependencies:`` with no list) is also accepted and treated as
# an empty collection.
dependencies: []
