# NexusDL — pytest configuration
#
# File: tests/pytest.ini
#
# Why pytest.ini and not [tool.pytest.ini_options] in pyproject.toml?
#   - pytest.ini takes precedence over pyproject.toml
#   - It is loaded BEFORE conftest.py, so markers are registered early
#   - It avoids any ambiguity with other tools that read pyproject.toml
#   - It keeps test config isolated from build config
#
# Usage:
#   pytest                              # all unit + integration
#   pytest -m unit                      # unit only (fast)
#   pytest -m integration               # integration only
#   pytest -m smoke                     # smoke (real network)
#   pytest -m "not slow"                # skip slow tests
#   pytest --cov=nexusdl                # coverage
#   pytest --cov=nexusdl --cov-report=html
#   pytest -n auto                      # parallel (pytest-xdist)
#
# ⚠️  Smoke/slow/network tests are SKIPPED by default (see conftest.py).
# ⚠️  Warnings are treated as errors (except a few documented ones).

[pytest]
# ────────────────────────────────────────────────────────────────────
# Versions and paths
# ────────────────────────────────────────────────────────────────────
minversion = 8.0

# Where to look for tests
testpaths =
    tests/unit
    tests/integration

# Directories to skip during collection
norecursedirs =
    .git
    .venv
    venv
    env
    .tox
    .nox
    .mypy_cache
    .ruff_cache
    .pytest_cache
    __pycache__
    node_modules
    build
    dist
    htmlcov
    .idea
    .vscode
    src/nexusdl/interfaces/web/frontend

# Files to consider as tests
python_files =
    test_*.py
    *_test.py

# Classes to consider as test classes
python_classes =
    Test*
    *Test

# Functions to consider as test functions
python_functions =
    test_*

# ────────────────────────────────────────────────────────────────────
# asyncio
# ────────────────────────────────────────────────────────────────────
# asyncio_mode = auto: any async test/function is automatically handled
# by pytest-asyncio (no need for @pytest.mark.asyncio).
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# ────────────────────────────────────────────────────────────────────
# Markers
# ────────────────────────────────────────────────────────────────────
markers =
    unit: fast tests, no I/O (network, disk, DB)
    integration: real filesystem, SQLite, may use disk
    smoke: real network (skipped by default; use -m smoke to run)
    slow: slow tests (skipped by default; use -m slow to run)
    network: requires network (skipped by default; use -m network to run)

# ────────────────────────────────────────────────────────────────────
# Default options
# ────────────────────────────────────────────────────────────────────
# -ra: show extra test summary (skipped, xfailed, xpassed)
# --strict-markers: fail on unknown markers (typos)
# --strict-config: fail on unknown config keys (typos)
# --tb=short: shorter tracebacks (still readable)
# --timeout=60: each test has 60 seconds max (pytest-timeout)
# --timeout-method=thread: safer for async
# --cov=nexusdl: coverage for the package
# --cov-report=term-missing: show uncovered lines
# --cov-report=html:htmlcov: generate HTML report
# --cov-fail-under=70: fail if coverage < 70%
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --timeout=60
    --timeout-method=thread
    --cov=nexusdl
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=70

# ────────────────────────────────────────────────────────────────────
# Warnings
# ────────────────────────────────────────────────────────────────────
# Treat warnings as errors (quality gate).
# Add exceptions here for well-understood warnings.
filterwarnings =
    error
    # Ignore deprecation warnings from third-party libs (not our code)
    ignore::DeprecationWarning:playwright.*
    ignore::DeprecationWarning:pkg_resources.*
    ignore::DeprecationWarning:setuptools.*
    # Ignore ResourceWarning for fixtures that close in teardown
    ignore::ResourceWarning
    # Ignore PytestUnraisableExceptionWarning (pytest-asyncio)
    ignore::pytest.PytestUnraisableExceptionWarning
    # Ignore our own deprecation warnings (test only)
    ignore::DeprecationWarning:tests.*

# ────────────────────────────────────────────────────────────────────
# Logging
# ────────────────────────────────────────────────────────────────────
# log_cli = true: show logs during test run (useful in CI, verbose in dev)
# log_cli_level = INFO: only INFO and above
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

# Capture logs for failing tests (shown in the traceback)
log_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

# ────────────────────────────────────────────────────────────────────
# xfail
# ────────────────────────────────────────────────────────────────────
# xfail_strict = true: XPASS (unexpectedly passing) is a failure.
xfail_strict = true

# ────────────────────────────────────────────────────────────────────
# JUnit XML (for CI)
# ────────────────────────────────────────────────────────────────────
# junit_family = xunit2: standard JUnit XML format for GitHub Actions
junit_family = xunit2

# ────────────────────────────────────────────────────────────────────
# Coverage (pytest-cov)
# ────────────────────────────────────────────────────────────────────
# Note: coverage config lives in pyproject.toml [tool.coverage.*]
# This section documents the pytest-cov options used in addopts.
#
# --cov=nexusdl           : measure coverage for the nexusdl package
# --cov-report=term-missing: show uncovered lines in terminal
# --cov-report=html:htmlcov: generate HTML report in htmlcov/
# --cov-fail-under=70     : fail if coverage < 70%
#
# Per-file overrides (in pyproject.toml):
#   [tool.coverage.run]
#   source = ["src/nexusdl"]
#   omit = ["*/interfaces/web/frontend/*", "*/_example/*", "*/custom/_template.py"]
#
#   [tool.coverage.report]
#   exclude_lines = [
#       "pragma: no cover",
#       "if TYPE_CHECKING:",
#       "raise NotImplementedError",
#       "\\.\\.\\.",
#       "if __name__ == .__main__.:",
#   ]

# ────────────────────────────────────────────────────────────────────
# Test ordering (pytest-randomly, if installed)
# ────────────────────────────────────────────────────────────────────
# random_order = false  # uncomment to run tests in random order
# random_seed = 0       # uncomment for reproducible random order

# ────────────────────────────────────────────────────────────────────
# Parallel execution (pytest-xdist, if installed)
# ────────────────────────────────────────────────────────────────────
# -n auto is enabled by default in CI (see .github/workflows/test.yml)
# Do NOT set it here to avoid breaking local debug.
# To run in parallel locally: pytest -n auto

# ────────────────────────────────────────────────────────────────────
# Test filtering by directory (examples)
# ────────────────────────────────────────────────────────────────────
# pytest tests/unit/core/test_models       # only model tests
# pytest tests/unit/parsers                # only parser tests
# pytest tests/integration                 # only integration tests
